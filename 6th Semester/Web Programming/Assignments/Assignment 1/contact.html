<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST-NUCES Contact Us</title>
    <link rel="icon" type="image/png" href="./FAST.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="header">

        <header class="header-content">

            <a href="#logo" class="logo">
                <img src="./FAST.png" alt="logoImage" class="logo-icon" />
                <span class="logo-text">FAST-NUCES</span>
            </a>

            <nav class="nav">
                <a href="./index.html" class="nav-link">Home</a>
                <a href="./courses.html" class="nav-link">Courses</a>
                <a href="./admissions.html" class="nav-link">Admissions</a>
            </nav>

            <a href="./contact.html" class="contact-button">
                Contact Us
            </a>

              <button type="button" class="menu-button">
                <img src="./Hamburger.svg" alt="menuButton" class="menu-icon" />
            </button>
        </header>
    </div>

<div class="container mt-5">
    <h1 class="mb-4">Contact Us</h1>

    <form onsubmit="return validateContactForm()">
        <fieldset>

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="e.g: Jhon Doe (Only Alphabets Can Be Entered)">
            </div>

            <div class="mb-3">
                <label for="number" class="form-label">Contact Number</label>
                <input type="tel" id="number" class="form-control" placeholder="e.g: +92-XXXXXXXXXX">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="e.g: johndoe@example.com">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" placeholder="Enter your message here"></textarea>
            </div>

            <div class="mb-3">
                <label for="captchaInput" class="form-label">
                    Enter Captcha: <strong id="captchaText"></strong>
                </label>
                <input type="number" id="captchaInput" class="form-control" placeholder="Enter the captcha value">
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </fieldset>

    </form>
</div>



<footer>
    <div class="Footer">
        Copyright © 2026 FAST-NUCES. All rights reserved.
    </div>
</footer>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
