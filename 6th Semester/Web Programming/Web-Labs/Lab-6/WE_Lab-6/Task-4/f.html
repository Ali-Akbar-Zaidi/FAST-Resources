<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <title>Task-4(f)</title>
</head>

<style>
    .header {
        font-size: 40px;
        font-weight: bold;
        text-align: center;
        color: rgb(20, 34, 139);
        margin-bottom: 20px;
    }

    .section1 {
        display: flex;
    }

    .button {
        margin: auto;
        font-size: 30px;
        width: 500px;
        height: auto;
        border-radius: 10px;
        padding: 10px;
    }

    .hover {
        background-color: rgb(12, 20, 81);
        color: lightblue;
    }

    .section2 {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
    }

    .modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: lightblue;
        color: rgb(12, 20, 81);
        padding-left: 20px;
        padding-right: 20px;
        padding-bottom: 30px;
        border-radius: 5px;
        font-size: 20px;
    }

    .closeButton {
        width: 20px;
        height: auto;
        padding: 2px;
    }
</style>

<body>
    <header class="header">(F)</header>
    <section class="section1">
        <button class="button">
            <b><i>
                (i) Hover Over Me to See the Effect of Newly Added Class!
                <br><br>
                (ii) Click Me to Display a Modal Window!
            </i></b>
        </button>
    </section>

    <section class="section2">
            <div class="modal-content">
                <h2>Modal</h2>
                <p>Welcome to our Modal Window.</p>
                <button id="closeButton"><b>Close</b></button>
            </div>
    </section>
</body>

<script>
    $(document).ready(function () {
        $(".button").hover(
            function () {
                $(this).addClass("hover");
            },
            function () {
                $(this).removeClass("hover");
            }
        );
    });

    $(document).ready(function () {
        $(".button").click(function () {
            $(".section2").show();
        });

        $("#closeButton").click(function () {
            $(".section2").hide();
        });
    });
</script>

</html>
