<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <table border="1">
        A Complex Table

        <tr style="background-color: darkgray;">
            <td colspan="4">Invoice 1213456789</td>
            <td colspan="4">14 January 2025</td>
        </tr>

        <tr>
            <td colspan="3"><b>Pay to:</b> <br> Acme Billing <br> 123 Main st. <br> Cityville, NA 12345</td>
            <td colspan="3"><b>Customer:</b> <br> John Smith <br> 321 willow way <br> southeast, MA 54321</td>
        </tr>

        <tr style="background-color: darkgray;">
            <th style="width: 25%;">Name/Description</th>
            <th style="width: 25%;" colspan="2">City</th>
            <th style="width: 25%;">@</th>
            <th style="width: 25%;">Cost</th>
        </tr>

        <tr>
            <td>Paper Clips</td>
            <td colspan="2">1000</td>
            <td>0.01</td>
            <td>10.00</td>
        </tr>

        <tr>
            <td>Staples (box)</td>
            <td colspan="2">100</td>
            <td>1.00</td>
            <td>100.00</td>
        </tr>

        <tr>
            <td style="background-color: darkgray;" colspan="4"><b>Subtotal</b></td>
            <td>110.00</td>
        </tr>

        <tr>
            <td style="background-color: darkgray;" colspan="3"><b>Tax</b></td>
            <td>8%</td>
            <td>8.80</td>
        </tr>
        
        <tr>
            <td style="background-color: darkgray;" colspan="4"><b>Grand Total</b></td>
            <td>$ 118.80</td>
        </tr>

    </table>

</body>
</html>
