<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

    <header class="h3 mb-5"><b>Task 1 (Grid/Flex)</b></header>

    <div class="container text-white">
        <div class="d-none d-lg-block">
            <div class="row d-flex align-items-center text-center" style="height: 15vh; background-color: blue;">
                <h4>Header</h4>
            </div>
            <div class="row d-flex align-items-center text-center"
                style="height: 15vh; background-color: rgb(3, 3, 146);">
                <h4>Nav</h4>
            </div>
            <div class="row">
                <div class="col-9 d-flex justify-content-center align-items-center"
                    style="height: 40vh; background-color: rgb(0, 128, 255);">
                    <h4>Main</h4>
                </div>
                <div class="col-3 d-flex justify-content-center align-items-center"
                    style="height: 40vh; background-color: rgb(68, 68, 149);">
                    <h4>Aside</h4>
                </div>
            </div>
            <div class="row d-flex d-flex align-items-center text-center"
                style="height: 15vh; background-color: rgb(104, 190, 236);">
                <h4>Footer</h4>
            </div>
        </div>
        <div class="d-lg-none">
            <div class="col-12 d-flex justify-content-center align-items-center" style="height: 15vh; background-color: blue;">
                <h4>Header</h4>
            </div>
            <div class="col-12 d-flex justify-content-center align-items-center"
                style="height: 40vh; background-color: rgb(0, 128, 255);">
                <h4>Main</h4>
            </div>
            <div class="col-12 d-flex justify-content-center align-items-center"
                style="height: 15vh; background-color: rgb(3, 3, 146);">
                <h4>Nav</h4>
            </div>
            <div class="col-12 d-flex justify-content-center align-items-center"
                style="height: 15vh; background-color: rgb(68, 68, 149);">
                <h4>Aside</h4>
            </div>
            <div class="col-12 d-flex justify-content-center align-items-center"
                style="height: 15vh; background-color: rgb(104, 190, 236);">
                <h4>Footer</h4>
            </div>
        </div>
    </div>

</body>

</html>
