<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header class="header"><b><i>Registration Form</i></b></header>

    <section class="section">
        <div class="image-div">
            <img src="./fallen-knight-dark-souls-3-from-software.jpg" alt="">
        </div>
        <form id="myForm" class="form" action="./21L-5845.html">
            <div id="form-div">
                <label for="">First Name</label><br>
                <input class="form-input" type="text">
            </div>
            <div id="form-div">
                <label for="">Last Name</label><br>
                <input class="form-input" type="text">
            </div>
            <div id="form-div">
                <label for="">Email</label><br>
                <input id="email" class="form-input" type="text" placeholder="email@domain.com">
            </div>
            <div id="form-div">
                <label for="">Phone Number</label><br>
                <input id="phoneNumber" class="form-input" type="text" placeholder="03XX-XXXXXXX">
            </div>
            <div id="form-div">
                <label for="">New Password</label><br>
                <input id="password1" class="form-input" type="password">
            </div>
            <div id="form-div">
                <label for="">Confirm Password</label><br>
                <input id="password2" class="form-input" type="password">
            </div>
            <div id="form-div">
                <input id="button" class="button" type="submit">
            </div>
        </form>
    </section>

    <footer class="footer">
        <p></p>
    </footer>

</body>

<script src="./script.js"></script>

</html>
